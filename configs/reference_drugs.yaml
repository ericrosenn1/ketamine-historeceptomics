# Units: order and expected_* fields are integer counts; labels, classes, lanes,
# and roster identifiers are categorical strings.
# Field/value constraints: Orders are unique 1..25, drug labels are unique,
# 25 external + 10 family = 35 profiles, and C(35, 2) = 595 unordered pairs.
