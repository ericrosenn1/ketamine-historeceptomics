site_name: Ketamine Historeceptomics
site_description: Reproducible historeceptomic analysis software and scientific documentation
site_url: https://ericrosenn1.github.io/ketamine-historeceptomics/
repo_url: https://github.com/ericrosenn1/ketamine-historeceptomics
repo_name: ericrosenn1/ketamine-historeceptomics
docs_dir: build/docs-source
site_dir: build/docs-site
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: README.md
  - Scientific documentation:
      - Methods: docs/METHODS.md
      - Data sources: docs/DATA_SOURCES.md
      - Provenance: docs/PROVENANCE.md
      - References: docs/REFERENCES.md
  - Reproducibility:
      - Reproducibility guide: docs/REPRODUCIBILITY.md
      - Full-mode boundary: docs/FULL_MODE.md
      - Validated environment: docs/ENVIRONMENT.md
      - Code architecture: docs/CODE_ARCHITECTURE.md
      - Developer guide: docs/DEVELOPER_GUIDE.md
  - Project:
      - Release notes: RELEASE_NOTES.md
      - Changelog: CHANGELOG.md
      - Contributing: CONTRIBUTING.md
      - Security: SECURITY.md
      - Support: SUPPORT.md
      - Data license: DATA_LICENSE.md
      - Third-party notices: THIRD_PARTY_NOTICES.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

plugins:
  - search
