name: Bug report
description: Report a reproducible software defect that is not a scientific-output mismatch.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, restricted data, private paths, or patient information.
  - type: input
    id: version
    attributes:
      label: Release or commit
      placeholder: v0.1.1 or a full commit SHA
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected and observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Give exact commands and non-secret inputs or a synthetic example.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, PowerShell, installation lane, and relevant hardware.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error output
      render: shell
