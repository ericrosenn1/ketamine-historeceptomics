# Purpose: Validate the self-contained public software and synthetic Smoke lane.
# Consumer: GitHub Actions on the public repository.
# Triggers: pushes to main, pull requests, and manual dispatch.
# Permissions: read-only repository contents; no secrets or write tokens required.
# Jobs: exact locked install, tests, Smoke, metadata/content/documentation audits,
# and a Gitleaks scan. Pip caching is content-keyed by the lockfile. The only
# artifact contains synthetic Smoke evidence. Required checks: public-validation
# and documentation-audit.
# Security assumption: restricted inputs and credentials are never present.
name: public-validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-validation:
    name: public-validation
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install exact locked environment
        run: python -m pip install -r requirements-lock.txt

      - name: Install package without resolving dependencies
        run: python -m pip install --no-deps -e .

      - name: Run self-contained unit and contract tests
        run: python -m pytest

      - name: Run synthetic public Smoke lane
        shell: pwsh
        run: |
          $env:CARDOZO_HR_PYTHON = (Get-Command python).Source
          .\launchers\run_reproduction.ps1 -Mode Smoke -OutputDir results\ci_smoke

      - name: Upload synthetic validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-smoke-evidence
          path: results/ci_smoke
          if-no-files-found: error
          retention-days: 14

  documentation-audit:
    name: documentation-audit
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install exact locked environment
        run: python -m pip install -r requirements-lock.txt

      - name: Check repository publication boundary
        run: python scripts/audit_repository.py --root . --check

      - name: Check code documentation and local links
        run: python scripts/audit_code_documentation.py --root . --check

      - name: Check deterministic repository metadata
        run: python scripts/build_repository_metadata.py --root . --check

      - name: Check deterministic public manifests
        run: python scripts/build_release_manifests.py --root . --check

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete public history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
