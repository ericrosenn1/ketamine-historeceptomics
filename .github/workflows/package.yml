# Purpose: Build, inspect, install, and smoke-test the public Python distributions.
# Consumer: GitHub Actions and maintainers evaluating distribution readiness.
# Change impact: validates packaging only and never publishes a distribution.
# Publication is intentionally separate; this workflow never uploads to PyPI.
name: Package Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: requirements-package.txt

      - name: Install pinned packaging tools
        run: python -m pip install -r requirements-package.txt

      - name: Build source and wheel distributions
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Audit distribution contents and provenance boundary
        run: python scripts/audit_distribution.py dist

      - name: Install wheel in a clean environment
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-smoke"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install -r requirements-lock.txt
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -c "import cardozo_ketamine_hr, importlib.metadata; assert cardozo_ketamine_hr.__version__ == importlib.metadata.version('ketamine-historeceptomics')"
          "${RUNNER_TEMP}/wheel-smoke/bin/cardozo-ketamine-hr" --help

      - name: Retain validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
