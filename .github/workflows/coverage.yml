# Purpose: Measure public-test coverage without excluding difficult scientific modules.
# Consumer: GitHub Actions, Codecov, and maintainers reviewing public test coverage.
# Change impact: affects coverage reporting only; scientific computation is unchanged.
# Authentication: Codecov upload uses GitHub OIDC; no repository secret is required.
# Environment: matches the repository's supported Windows public-validation lane.
name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: coverage
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: requirements-coverage.txt

      - name: Install exact coverage environment
        run: python -m pip install -r requirements-coverage.txt

      - name: Install package without dependency resolution
        run: python -m pip install --no-deps -e .

      - name: Measure public test coverage
        run: >-
          python -m pytest
          --cov=cardozo_ketamine_hr
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Upload coverage XML to Codecov with OIDC
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: true

      - name: Retain coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
