# Purpose: Publish an independent OpenSSF Scorecard result and SARIF evidence.
# Consumer: OpenSSF, GitHub code scanning, and repository security reviewers.
# Change impact: adds read-only supply-chain analysis and public score publication.
# Security: Read-only by default; only OIDC publication and SARIF upload can write.
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '23 7 * * 3'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard
    if: github.event.repository.default_branch == github.ref_name
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Check out exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Retain Scorecard SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          if-no-files-found: error
          retention-days: 5

      - name: Upload Scorecard findings to code scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
