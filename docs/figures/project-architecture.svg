<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940" role="img" aria-labelledby="title desc">
  <title id="title">Ketamine historeceptomics project architecture</title>
  <desc id="desc">Scientific pharmacology and tissue expression form HR matrices, GESD fingerprints and comparison analyses. Approved outputs feed the implemented public versioned export. Dashed arrows to the two private-source research applications are future adoption interfaces. The applications currently use independent snapshots and literature interpretation, with a verified phenotype-evidence import into the state build.</desc>
  <!-- Maintainable source: plain SVG, grouped scientific stages and explicit arrow semantics. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#45647a"/></marker>
    <marker id="future" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#986112"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#183449}
      .title{font-size:27px;font-weight:700}.section{font-size:15px;font-weight:700;letter-spacing:1px}
      .label{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#45647a}
      .panel{fill:#f6f9fc;stroke:#cbd9e2;stroke-width:1.5}.node{fill:#fff;stroke:#9cb7c8;stroke-width:1.5}
      .science{fill:#edf7f7;stroke:#68a5a0;stroke-width:1.5}.exchange{fill:#eff4ff;stroke:#7f9dcc;stroke-width:1.5}
      .apps{fill:#fff8ec;stroke:#c1a268;stroke-width:1.5}.evidence{fill:#f5f0fb;stroke:#af98c7;stroke-width:1.5}
      .line{fill:none;stroke:#45647a;stroke-width:2.5;marker-end:url(#arrow)}
      .future{fill:none;stroke:#986112;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#future)}
    </style>
  </defs>
  <rect width="1240" height="940" fill="#fff"/>
  <text x="28" y="42" class="title">Ketamine historeceptomics: computation, interpretation and applications</text>
  <path d="M30 77 H85" class="line"/><text x="99" y="82" class="body">Verified method or inspected existing connection</text>
  <path d="M643 77 H698" class="future"/><text x="712" y="82" class="body">Proposed application adoption; not deployed</text>

  <g id="scientific-computation">
    <rect x="24" y="112" width="1192" height="246" rx="12" class="panel"/>
    <text x="44" y="140" class="section">SCIENTIFIC DATA AND COMPUTATION</text>
    <rect x="46" y="160" width="205" height="66" rx="8" class="node"/>
    <text x="62" y="186" class="label" style="font-size:15px">Compound pharmacology</text><text x="62" y="207" class="small">Selected target activity</text>
    <rect x="46" y="246" width="205" height="66" rx="8" class="node"/>
    <text x="62" y="272" class="label">Tissue expression</text><text x="62" y="293" class="small">Source-specific standardization</text>
    <path d="M251 193 H276 V235 H302" class="line"/>
    <path d="M251 279 H276 V235 H302" class="line"/>
    <rect x="302" y="197" width="190" height="77" rx="8" class="science"/>
    <text x="320" y="225" class="label">HR-score matrices</text><text x="320" y="248" class="body">Activity × expression Z</text>
    <path d="M492 235 H541" class="line"/>
    <rect x="541" y="197" width="203" height="77" rx="8" class="science"/>
    <text x="558" y="225" class="label">GESD fingerprints</text><text x="558" y="248" class="body">α = 0.001 / 0.0001</text>
    <path d="M744 235 H792" class="line"/>
    <rect x="792" y="185" width="396" height="99" rx="8" class="science"/>
    <text x="809" y="212" class="label">Comparison and multivariate analyses</text>
    <text x="809" y="236" class="body">Principal: sparse fingerprint comparisons</text>
    <text x="809" y="260" class="body">Exploratory: continuous HR comparisons</text>
    <text x="46" y="337" class="small">Private scientific development preserves governed upstream authorities; public methods retain their documented input boundaries.</text>
  </g>

  <g id="public-producer">
    <path d="M990 284 V379 H257 V395" class="line"/>
    <rect x="24" y="397" width="1192" height="164" rx="12" class="panel"/>
    <text x="44" y="425" class="section">PUBLIC COMPUTATIONAL REPOSITORY</text>
    <rect x="48" y="442" width="354" height="91" rx="8" class="science"/>
    <text x="65" y="468" class="label">Validated scientific outputs</text>
    <text x="65" y="492" class="body">60 retained reference artifacts</text>
    <text x="65" y="514" class="small">Frozen values, provenance and publication decisions</text>
    <path d="M402 488 H451" class="line"/>
    <rect x="451" y="442" width="352" height="91" rx="8" class="exchange"/>
    <text x="468" y="468" class="label">Versioned file contract v1.0.0</text>
    <text x="468" y="492" class="body">Export + manifest + compatibility validation</text>
    <text x="468" y="514" class="small">Approved whole-body calls; synthetic examples</text>
    <rect x="838" y="442" width="350" height="91" rx="8" class="node"/>
    <text x="855" y="469" class="label">Independent consumer interface</text>
    <text x="855" y="493" class="body">Explicit identities, hashes and support states</text>
    <text x="855" y="515" class="small">No excluded matrices or private evidence export</text>
  </g>

  <g id="application-consumers">
    <path d="M564 533 V582 H220 V614" class="future"/>
    <path d="M683 533 V614" class="future"/>
    <text x="257" y="602" class="small">Future thin adapters in each private app</text>
    <rect x="24" y="617" width="786" height="235" rx="12" class="panel"/>
    <text x="44" y="646" class="section">RESEARCH APPLICATIONS · PRIVATE SOURCE, PUBLIC INTERFACES</text>
    <rect x="47" y="664" width="343" height="157" rx="8" class="apps"/>
    <text x="64" y="691" class="label">Ketamine Phenotype Explorer</text>
    <text x="64" y="718" class="body">Independent coordinate + evidence authority</text>
    <text x="64" y="744" class="body">Phenotype filtering, source inspection</text>
    <text x="64" y="770" class="body">Interactive Sankey network and exports</text>
    <text x="64" y="798" class="small">No public-repository loader currently verified</text>
    <rect x="421" y="664" width="365" height="157" rx="8" class="apps"/>
    <text x="438" y="691" class="label">Expression-State Explorer</text>
    <text x="438" y="718" class="body">Independent atlas/condition processing</text>
    <text x="438" y="744" class="body">Dataset-specific HR and fingerprints</text>
    <text x="438" y="770" class="body">Anatomical, 2D/3D graphs and provenance</text>
    <text x="438" y="798" class="small">Hosted static snapshot; uploads are local-only</text>
    <path d="M390 782 H421" class="line"/>
    <text x="47" y="840" class="small">Existing state build imports separately governed phenotype evidence; application snapshots remain independent.</text>
  </g>

  <g id="scientific-interpretation">
    <rect x="838" y="617" width="378" height="235" rx="12" class="evidence"/>
    <text x="858" y="646" class="section">SCIENTIFIC INTERPRETATION</text>
    <text x="858" y="681" class="label">Literature evidence</text>
    <text x="858" y="710" class="body">Source-qualified phenotype associations</text>
    <text x="858" y="738" class="body">Pathology / disease-context associations</text>
    <text x="858" y="774" class="small">Separately maintained application layers</text>
    <text x="858" y="797" class="small">Associations do not establish causality</text>
    <text x="858" y="820" class="small">No private literature authority published here</text>
    <path d="M838 735 H786" class="line"/>
  </g>
  <text x="28" y="889" class="body">The producer interface is implemented here. Neither production application has adopted it.</text>
  <text x="28" y="916" class="small">Source inspection and public-interface review: 2026-10-31 · Full matrices, source-specific restrictions and accepted scientific results remain governed.</text>
</svg>
